<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Know Your Traders | Beneath the Ashes</title>
  <meta name="description" content="Explore Beneath the Ashes traders, locations, specialties, buying lists and stock information.">
  <meta property="og:title" content="Know Your Traders | Beneath the Ashes">
  <meta property="og:description" content="Find the right trader before you make the trip.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header><div class="wrap"><div class="brand"><div class="mark"><span>🔥</span></div><div>Beneath the Ashes</div></div></div></header>
<main class="wrap">
<section class="hero">
  <div class="kicker">Survivor Field Guide</div>
  <h1>Know Your<br>Traders</h1>
  <p>Find out who buys what, where they operate, what they stock, and whether the trip is worth making before you load the truck.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search trader, location, specialty..." aria-label="Search traders">
    <select id="location" aria-label="Filter by location"><option value="">All locations</option></select>
  </div>
</section>
<section class="grid" id="traderGrid"></section>
<div class="empty" id="empty">No traders match that search.</div>
</main>
<footer><div class="wrap">Beneath the Ashes • Trader information may change as the economy evolves.</div></footer>
<script>
const traders = [{"slug": "gabi", "name": "Gabi", "title": "Collectables Trader", "location": "The Curator's Refuge", "region": "Mainland Chernarus", "currency": "USD", "specialty": "Pok\u00e9mon \u2022 Collectables \u2022 Storage", "summary": "Mainland collectables trader specializing in sealed Pok\u00e9mon boxes and collection storage solutions.", "buys": ["Sealed Pok\u00e9mon booster boxes", "Select collectables"], "sells": ["Pok\u00e9mon card storage boxes", "Collectable storage solutions", "Posters and display items", "Fallout lunchboxes"], "notes": ["Only sealed Pok\u00e9mon boxes are accepted for Pok\u00e9mon box sales.", "Cinder Market may pay more for certain high-tier collectables."], "image": "assets/traders/gabi.jpg"}, {"slug": "hassan", "name": "Hassan", "title": "Drug Production Trader", "location": "Cinder Market", "region": "Eastern Sea", "currency": "USD", "specialty": "Finished Goods \u2022 Production Kits", "summary": "Cinder Market trader for finished drug products and drug production equipment.", "buys": ["Finished drug bricks of all types", "Select drug bundles"], "sells": ["Zip-lock baggies for bricking production", "Drug production kits and stations"], "notes": ["Finished bricks are your best bet when selling.", "Travel to Cinder Market requires appropriate transportation."], "image": "assets/traders/hassan.jpg"}, {"slug": "kaito", "name": "Kaito", "title": "Premium Collectables Trader", "location": "Cinder Market", "region": "Eastern Sea", "currency": "USD", "specialty": "Rare \u2022 Epic \u2022 Premium Collectables", "summary": "Cinder Market's premium collectables buyer, offering stronger payouts for valuable finds.", "buys": ["Rare and high-tier collectables", "Fallout collectables", "Vyse and other premium collectables"], "sells": ["Select collectable-related items"], "notes": ["Cinder Market is generally the best payout for premium collectables.", "Some collection systems have special turn-in rules."], "image": "assets/traders/kaito.jpg"}, {"slug": "peter", "name": "Peter", "title": "Hunting Trader", "location": "Cinder & Fang", "region": "Chernarus", "currency": "USD", "specialty": "Hunting \u2022 Pelts \u2022 Game", "summary": "Hunting-focused trader for survivors making their living from the wild.", "buys": ["Hunting-related goods", "Animal products and select game"], "sells": ["Hunting supplies and equipment"], "notes": ["Exact stock and accepted items may change with economy balancing."], "image": "assets/traders/peter.jpg"}, {"slug": "keiko", "name": "Keiko", "title": "Fishing Trader", "location": "The Grey Current", "region": "Chernarus", "currency": "USD", "specialty": "Fishing \u2022 Seafood \u2022 Supplies", "summary": "Fishing specialist and one of the strongest routes for survival-focused income.", "buys": ["Fish and select fishing catches"], "sells": ["Fishing supplies and related equipment"], "notes": ["Fishing is designed as a major money-making path in the server economy."], "image": "assets/traders/keiko.jpg"}];
const grid = document.getElementById('traderGrid');
const search = document.getElementById('search');
const locationFilter = document.getElementById('location');
const empty = document.getElementById('empty');

[...new Set(traders.map(t=>t.location))].sort().forEach(loc=>{
  const o=document.createElement('option');o.value=loc;o.textContent=loc;locationFilter.appendChild(o);
});

function render(){
  const q=search.value.trim().toLowerCase(), loc=locationFilter.value;
  const filtered=traders.filter(t=>{
    const hay=[t.name,t.title,t.location,t.region,t.specialty,t.summary,...t.buys,...t.sells].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!loc||t.location===loc);
  });
  grid.innerHTML=filtered.map(t=>`
    <a class="card" href="./${t.slug}/">
      <img src="../${t.image}" alt="${t.name}, ${t.title}" onerror="this.style.display='none'">
      <div class="card-body">
        <div class="kicker">${t.title}</div>
        <h2>${t.name}</h2>
        <div class="meta">${t.location} • ${t.region}</div>
        <div class="chips">${t.specialty.split('•').map(x=>`<span class="chip">${x.trim()}</span>`).join('')}</div>
        <span class="cta">Open trader profile →</span>
      </div>
    </a>`).join('');
  empty.style.display=filtered.length?'none':'block';
}
search.addEventListener('input',render); locationFilter.addEventListener('change',render); render();
</script>
</body>
</html>
